[workspace]
members = [
    ".",
    "crates/flux-types",
    "crates/flux-common",
    "crates/flux-router",
    "crates/flux-dns",
    "crates/flux-transport",
    "crates/flux-protocol",
    "crates/flux-inbound",
    "crates/flux-outbound",
    "crates/flux-app",
]
resolver = "2"

[workspace.dependencies]
flux-types = { path = "crates/flux-types" }
flux-common = { path = "crates/flux-common" }
flux-router = { path = "crates/flux-router" }
flux-dns = { path = "crates/flux-dns" }
flux-transport = { path = "crates/flux-transport" }
flux-protocol = { path = "crates/flux-protocol" }
flux-inbound = { path = "crates/flux-inbound" }
flux-outbound = { path = "crates/flux-outbound" }
flux-app = { path = "crates/flux-app" }

tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "net", "io"] }
bytes = "1.10"
futures-util = "0.3"
async-trait = "0.1"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
uuid = { version = "1.15", features = ["v4", "serde"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
rcgen = "0.13"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
rand = "0.8"
dashmap = "6.1"
lru = "0.13"
ipnet = { version = "2.11", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
serde_yaml_ng = "0.10"
glob = "0.3"
criterion = { version = "0.5", features = ["async_tokio"] }
mimalloc = { version = "0.1", default-features = false }
socket2 = { version = "0.5", features = ["all"] }
libc = "0.2"
parking_lot = "0.12"
pem = "3"
hmac = "0.12"
blake3 = "1.8"
h2 = "0.4"
maxminddb = "0.32"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "ring"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
[package]
name = "flux-core"
version = "0.1.0"
edition = "2024"

[dependencies]
flux-types = { workspace = true }
flux-app = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
flux-common = { workspace = true }
flux-router = { workspace = true }
flux-dns = { workspace = true }
flux-transport = { workspace = true }
flux-protocol = { workspace = true }
flux-inbound = { workspace = true }
flux-outbound = { workspace = true }
tempfile = "3"
uuid = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true }
sha1 = { workspace = true }
x25519-dalek = { workspace = true }
rand = { workspace = true }
criterion = { workspace = true }
rcgen = { workspace = true }

[[bench]]
name = "throughput"
harness = false

[[example]]
name = "stress_bench"
path = "examples/stress_bench.rs"

[[example]]
name = "bench_native"
path = "examples/bench_native.rs"
